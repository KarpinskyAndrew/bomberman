<main class="nf">

    <div class="arena-host" aria-hidden="true"><canvas id="strip"></canvas></div>

    <div class="row" style="justify-content:center">

  </div>

<script src="arena.js"></script>
<script src="mock.js"></script>
<script>
  // A thin slice through the middle of an arena: a player between a bomb and a Drifter.
  Arena.mount(document.getElementById('strip'), {
    seed: 5, density: 0, cover: true, zoom: 2.5,
    players: [{ x: 10, y: 11, color: Arena.COLORS.p1, dir: 'r' }],
    bombs: [{ x: 9, y: 11 }],
    aliens: [{ type: 'drifter', x: 12, y: 11 }],
    items: [{ x: 11, y: 9, kind: 'fire' }]
  });
</script>
