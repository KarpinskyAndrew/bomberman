<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BomberMan Online · Coming soon</title>
<meta name="description" content="Real-time multiplayer arena battles in your browser. 2–4 players, best of 3, ranked ELO. The fuse is lit.">
<meta name="theme-color" content="#0a0e18">
<meta property="og:title" content="BomberMan Online · Wait for it…">
<meta property="og:description" content="Real-time multiplayer arena battles in your browser. The fuse is lit.">
<meta property="og:url" content="https://bomberman.space/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='28' cy='38' r='22' fill='%231b2133'/%3E%3Ccircle cx='21' cy='31' r='6' fill='%23ffffff' opacity='.35'/%3E%3Cpath d='M40 20q6-10 14-8' stroke='%23c9a46a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='55' cy='11' r='6' fill='%23ffb02e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e18;
    --ink: #f3f1ea;
    --muted: #a7adbd;
    --fire-1: #ffdd55;
    --fire-2: #ff8a1f;
    --fire-3: #ff3d2e;
    --card: rgba(12, 16, 28, 0.62);
    --card-edge: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#arena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 50% 50%, rgba(10,14,24,0.78) 0%, rgba(10,14,24,0.35) 60%, rgba(10,14,24,0) 100%),
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(10,14,24,0) 55%, rgba(10,14,24,0.85) 100%);
  }
  main {
    position: relative; z-index: 1;
    min-height: 100%;
    display: grid; place-items: center;
    padding: 24px 16px;
  }
  .card {
    width: min(640px, 100%);
    text-align: center;
    padding: clamp(28px, 5vw, 48px) clamp(20px, 5vw, 48px);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 20px;
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  .bomb { width: 84px; height: 84px; margin: 0 auto 18px; display: block; overflow: visible; }
  .bomb .body { animation: throb 1.2s ease-in-out infinite; transform-origin: 40px 50px; }
  .bomb .spark { animation: flicker 0.18s steps(2) infinite; transform-origin: 66px 14px; }
  .eyebrow {
    font-family: Bungee, Inter, sans-serif;
    font-size: clamp(14px, 2.4vw, 18px);
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .eyebrow .dots span { animation: dot 1.4s infinite; opacity: 0; }
  .eyebrow .dots span:nth-child(2) { animation-delay: 0.2s; }
  .eyebrow .dots span:nth-child(3) { animation-delay: 0.4s; }
  h1 {
    font-family: Bungee, Inter, sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 9vw, 76px);
    line-height: 1.02;
    margin: 10px 0 18px;
    background: linear-gradient(180deg, var(--fire-1) 0%, var(--fire-2) 55%, var(--fire-3) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 24px rgba(255, 120, 30, 0.35));
  }
  .lede { font-size: clamp(15px, 2.2vw, 18px); line-height: 1.6; color: var(--ink); opacity: 0.92; max-width: 46ch; margin: 0 auto; }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 0 26px; list-style: none; }
  .facts li {
    font-size: 13px; font-weight: 500; color: var(--muted);
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--card-edge); background: rgba(255,255,255,0.03);
  }
  .fuse { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; position: relative; }
  .fuse i {
    position: absolute; inset: 0 auto 0 0; width: 100%;
    background: linear-gradient(90deg, #6b5536, #c9a46a);
    transform-origin: right center;
    animation: burn 14s linear infinite;
  }
  .fuse-label { margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  footer { margin-top: 26px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.25); }
  footer a:hover { border-bottom-color: var(--fire-2); }
  @keyframes throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes flicker { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.7) rotate(25deg); opacity: 0.8; } }
  @keyframes dot { 0%, 20% { opacity: 0; } 40%, 100% { opacity: 1; } }
  @keyframes burn { from { transform: scaleX(1); } to { transform: scaleX(0.04); } }
  @media (prefers-reduced-motion: reduce) {
    .bomb .body, .bomb .spark, .eyebrow .dots span, .fuse i { animation: none; opacity: 1; }
    .fuse i { transform: scaleX(0.35); }
  }
</style>
</head>
<body>
<canvas id="arena" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<main>
  <section class="card">
    <svg class="bomb" viewBox="0 0 84 84" aria-hidden="true">
      <g class="body">
        <circle cx="38" cy="50" r="27" fill="#1b2133"/>
        <circle cx="38" cy="50" r="27" fill="none" stroke="#2c3550" stroke-width="2"/>
        <ellipse cx="28" cy="40" rx="8" ry="6" fill="#fff" opacity="0.18"/>
        <rect x="48" y="20" width="12" height="10" rx="2" fill="#2c3550" transform="rotate(35 54 25)"/>
      </g>
      <path d="M57 19 q5 -10 9 -5" stroke="#c9a46a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g class="spark">
        <circle cx="66" cy="14" r="6" fill="#ff8a1f"/>
        <circle cx="66" cy="14" r="3" fill="#ffdd55"/>
        <path d="M66 3 v5 M66 20 v5 M55 14 h5 M72 14 h5 M59 7 l3 3 M70 18 l3 3 M73 7 l-3 3 M59 21 l3 -3" stroke="#ffdd55" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </svg>
    <p class="eyebrow">Wait for it<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    <h1>It's coming!!!</h1>
    <p class="lede">A real-time multiplayer arena in your browser. Drop bombs, chain the blasts, dodge the aliens, and be the last one standing.</p>
    <ul class="facts">
      <li>2–4 players</li>
      <li>Best of 3</li>
      <li>Ranked ELO</li>
      <li>Play as guest</li>
    </ul>
    <div class="fuse" role="img" aria-label="The fuse is burning"><i></i></div>
    <p class="fuse-label">The fuse is lit.</p>
    <footer>
      Follow the build on <a href="https://github.com/KarpinskyAndrew/bomberman" rel="noopener">GitHub</a>
      · © <span id="year">2026</span> bomberman.space
    </footer>
  </section>
</main>
<script>
(() => {
  "use strict";
  document.getElementById("year").textContent = String(new Date().getFullYear());

  const canvas = document.getElementById("arena");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const EMPTY = 0, PILLAR = 1, SOFT = 2;
  const FUSE = 2.2, FIRE_TIME = 0.55, ALIEN_SPEED = 2.2; // seconds, seconds, tiles/s
  const COLORS = {
    floorA: "#0f1422", floorB: "#111727",
    pillar: "#232b40", pillarTop: "#2f3954", pillarEdge: "#191f30",
    soft: "#4a3526", softLine: "#33241a", softTop: "#5b4330",
  };

  let W = 0, H = 0, T = 40, cols = 0, rows = 0, ox = 0, oy = 0;
  let grid, regrowAt, fire, fireAge, bombs, aliens, pops;
  let clock = 0, nextBomb = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (n) => (Math.random() * n) | 0;
  const idx = (x, y) => y * cols + x;
  const inside = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;

  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    T = W < 600 ? 34 : W < 1400 ? 44 : 52;
    cols = Math.ceil(W / T) + 2; rows = Math.ceil(H / T) + 2;
    if (cols % 2 === 0) cols++;
    if (rows % 2 === 0) rows++;
    ox = Math.round((W - cols * T) / 2); oy = Math.round((H - rows * T) / 2);
    const n = cols * rows;
    grid = new Uint8Array(n); regrowAt = new Float64Array(n);
    fire = new Float64Array(n); fireAge = new Float64Array(n);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      grid[idx(x, y)] = (x % 2 === 0 && y % 2 === 0) ? PILLAR : (Math.random() < 0.42 ? SOFT : EMPTY);
    }
    bombs = []; pops = [];
    aliens = [];
    const count = Math.max(4, Math.round(n / 140));
    for (let i = 0; i < count; i++) spawnAlien(true);
  }

  function randomEmpty() {
    for (let tries = 0; tries < 200; tries++) {
      const x = randi(cols), y = randi(rows), i = idx(x, y);
      if (grid[i] === EMPTY && !bombAt(x, y)) return [x, y];
    }
    return null;
  }
  function bombAt(x, y) { return bombs.some(b => b.x === x && b.y === y); }
  function blocked(x, y) { return !inside(x, y) || grid[idx(x, y)] !== EMPTY || bombAt(x, y); }

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function spawnAlien(initial) {
    const p = randomEmpty(); if (!p) return;
    const hue = Math.random() < 0.6 ? "green" : "purple";
    aliens.push({ x: p[0], y: p[1], tx: p[0], ty: p[1], prog: 1, dir: randi(4), kind: hue,
                  born: initial ? -10 : clock, wobble: rand(0, 6.28), dead: false });
  }

  function pickDir(a) {
    const opts = [];
    for (let d = 0; d < 4; d++) {
      const nx = a.x + DIRS[d][0], ny = a.y + DIRS[d][1];
      if (!blocked(nx, ny) && fire[idx(nx, ny)] <= clock) opts.push(d);
    }
    if (!opts.length) return -1;
    if (opts.includes(a.dir) && Math.random() < 0.7) return a.dir;
    return opts[randi(opts.length)];
  }

  function explode(b) {
    b.done = true;
    const range = b.range;
    ignite(b.x, b.y);
    for (const [dx, dy] of DIRS) {
      for (let r = 1; r <= range; r++) {
        const x = b.x + dx * r, y = b.y + dy * r;
        if (!inside(x, y)) break;
        const i = idx(x, y);
        if (grid[i] === PILLAR) break;
        if (grid[i] === SOFT) {
          grid[i] = EMPTY; regrowAt[i] = clock + rand(7, 16);
          ignite(x, y); burst(x, y, "#7a5a3c", 6);
          break;
        }
        ignite(x, y);
        for (const other of bombs) if (!other.done && other.x === x && other.y === y) explode(other); // chain
      }
    }
  }
  function ignite(x, y) { const i = idx(x, y); fire[i] = clock + FIRE_TIME; fireAge[i] = clock; }
  function burst(x, y, color, n) {
    for (let k = 0; k < n; k++) pops.push({ x: ox + (x + 0.5) * T, y: oy + (y + 0.5) * T,
      vx: rand(-90, 90), vy: rand(-140, 20), life: rand(0.4, 0.8), age: 0, color, s: rand(2, 5) });
  }

  function update(dt) {
    clock += dt;

    if (clock >= nextBomb) {
      const p = randomEmpty();
      if (p && bombs.length < Math.max(3, (cols * rows) / 90)) bombs.push({ x: p[0], y: p[1], t: clock, range: 2 + randi(2), done: false });
      nextBomb = clock + rand(0.35, 0.9);
    }
    for (const b of bombs) if (!b.done && clock - b.t >= FUSE) explode(b);
    bombs = bombs.filter(b => !b.done);

    for (let i = 0; i < grid.length; i++) {
      if (grid[i] === EMPTY && regrowAt[i] && clock >= regrowAt[i]) {
        const x = i % cols, y = (i / cols) | 0;
        const occupied = bombAt(x, y) || fire[i] > clock || aliens.some(a => !a.dead && (a.x === x && a.y === y || a.tx === x && a.ty === y));
        if (occupied) regrowAt[i] = clock + 2; else { grid[i] = SOFT; regrowAt[i] = -clock; } // negative = fade-in start
      }
    }

    for (const a of aliens) {
      if (a.dead) continue;
      if (a.prog >= 1) {
        a.x = a.tx; a.y = a.ty;
        const d = pickDir(a);
        if (d >= 0) { a.dir = d; a.tx = a.x + DIRS[d][0]; a.ty = a.y + DIRS[d][1]; a.prog = 0; }
      } else {
        a.prog = Math.min(1, a.prog + ALIEN_SPEED * dt);
      }
      const ox_ = a.prog > 0.5 ? a.tx : a.x, oy_ = a.prog > 0.5 ? a.ty : a.y;
      if (inside(ox_, oy_) && fire[idx(ox_, oy_)] > clock) {
        a.dead = true; a.diedAt = clock;
        burst(ox_, oy_, a.kind === "green" ? "#7ee081" : "#c08cff", 14);
      }
    }
    aliens = aliens.filter(a => !a.dead);
    const target = Math.max(4, Math.round((cols * rows) / 140));
    if (aliens.length < target && Math.random() < dt * 0.5) spawnAlien(false);

    for (const p of pops) { p.age += dt; p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    pops = pops.filter(p => p.age < p.life);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawSoft(px, py, alpha) {
    ctx.globalAlpha = alpha;
    const p = 2;
    ctx.fillStyle = COLORS.soft; roundRect(px + p, py + p, T - 2 * p, T - 2 * p, 5); ctx.fill();
    ctx.fillStyle = COLORS.softTop; ctx.fillRect(px + p + 3, py + p + 2, T - 2 * p - 6, 3);
    ctx.strokeStyle = COLORS.softLine; ctx.lineWidth = 2;
    const h3 = (T - 2 * p) / 3;
    ctx.beginPath();
    for (let r = 1; r < 3; r++) { ctx.moveTo(px + p + 2, py + p + r * h3); ctx.lineTo(px + T - p - 2, py + p + r * h3); }
    ctx.moveTo(px + T / 2, py + p + 2); ctx.lineTo(px + T / 2, py + p + h3);
    ctx.moveTo(px + T / 3, py + p + h3); ctx.lineTo(px + T / 3, py + p + 2 * h3);
    ctx.moveTo(px + (2 * T) / 3, py + p + h3); ctx.lineTo(px + (2 * T) / 3, py + p + 2 * h3);
    ctx.moveTo(px + T / 2, py + p + 2 * h3); ctx.lineTo(px + T / 2, py + T - p - 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.fillStyle = COLORS.floorA; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const px = ox + x * T, py = oy + y * T, i = idx(x, y);
      if ((x + y) % 2) { ctx.fillStyle = COLORS.floorB; ctx.fillRect(px, py, T, T); }
      if (grid[i] === PILLAR) {
        ctx.fillStyle = COLORS.pillarEdge; roundRect(px + 1, py + 3, T - 2, T - 3, 6); ctx.fill();
        ctx.fillStyle = COLORS.pillar; roundRect(px + 1, py + 1, T - 2, T - 5, 6); ctx.fill();
        ctx.fillStyle = COLORS.pillarTop; roundRect(px + 5, py + 4, T - 10, 5, 3); ctx.fill();
      } else if (grid[i] === SOFT) {
        const fadeStart = regrowAt[i] < 0 ? -regrowAt[i] : -1;
        drawSoft(px, py, fadeStart > 0 ? Math.min(1, (clock - fadeStart) / 0.8) : 1);
      }
    }

    // fire
    for (let i = 0; i < fire.length; i++) {
      if (fire[i] <= clock) continue;
      const x = i % cols, y = (i / cols) | 0, px = ox + x * T, py = oy + y * T;
      const life = (clock - fireAge[i]) / FIRE_TIME, a = 1 - life * life;
      const grow = Math.min(1, (clock - fireAge[i]) / 0.08);
      const inset = T * (0.5 - 0.46 * grow);
      ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(px + T / 2, py + T / 2, 1, px + T / 2, py + T / 2, T * 0.7);
      g.addColorStop(0, "#fff6c2"); g.addColorStop(0.35, "#ffdd55"); g.addColorStop(0.7, "#ff8a1f"); g.addColorStop(1, "#ff3d2e");
      ctx.fillStyle = g; roundRect(px + inset, py + inset, T - 2 * inset, T - 2 * inset, 8); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // bombs
    for (const b of bombs) {
      const t = (clock - b.t) / FUSE, cx = ox + (b.x + 0.5) * T, cy = oy + (b.y + 0.55) * T;
      const pulse = 1 + 0.07 * Math.sin(clock * (8 + 22 * t));
      const r = T * 0.32 * pulse;
      ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.85, r * 0.9, r * 0.3, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = t > 0.75 && Math.sin(clock * 40) > 0 ? "#5a2230" : "#1b2133";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.28, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "#c9a46a"; ctx.lineWidth = 2; ctx.beginPath();
      const fx = cx + r * 0.55, fy = cy - r * 0.8, len = 1 - t;
      ctx.moveTo(fx, fy); ctx.quadraticCurveTo(fx + 6 * len, fy - 10 * len, fx + 10 * len, fy - 6 * len); ctx.stroke();
      const sx = fx + 10 * len, sy = fy - 6 * len, sr = 2.5 + Math.random() * 2.5;
      ctx.fillStyle = "#ff8a1f"; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#ffdd55"; ctx.beginPath(); ctx.arc(sx, sy, sr * 0.5, 0, 6.283); ctx.fill();
    }

    // aliens
    for (const a of aliens) {
      const ease = a.prog < 1 ? a.prog : 1;
      const fx = a.x + (a.tx - a.x) * ease, fy = a.y + (a.ty - a.y) * ease;
      const cx = ox + (fx + 0.5) * T, cy = oy + (fy + 0.5) * T + Math.sin(clock * 6 + a.wobble) * 1.5;
      const appear = Math.min(1, (clock - a.born) / 0.6);
      const s = T * 0.3 * appear;
      if (s <= 0.5) continue;
      const body = a.kind === "green" ? "#5fcf6a" : "#9a6bff", dark = a.kind === "green" ? "#2f8a3b" : "#5a37b8";
      ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(cx, cy + s * 1.05, s * 0.9, s * 0.25, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = dark; ctx.beginPath();
      ctx.moveTo(cx - s, cy + s * 0.9);
      for (let k = 0; k <= 4; k++) ctx.lineTo(cx - s + (k * 2 * s) / 4, cy + s * (k % 2 ? 0.6 : 0.95));
      ctx.lineTo(cx + s, cy); ctx.arc(cx, cy, s, 0, Math.PI, true); ctx.closePath(); ctx.fill();
      ctx.fillStyle = body; ctx.beginPath(); ctx.arc(cx, cy - s * 0.05, s * 0.92, Math.PI, 0); ctx.lineTo(cx + s * 0.92, cy + s * 0.55); ctx.lineTo(cx - s * 0.92, cy + s * 0.55); ctx.closePath(); ctx.fill();
      const look = DIRS[a.dir] || [0, 0];
      for (const ex of [-0.38, 0.38]) {
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx + ex * s, cy - s * 0.15, s * 0.26, 0, 6.283); ctx.fill();
        ctx.fillStyle = "#121624"; ctx.beginPath(); ctx.arc(cx + ex * s + look[0] * s * 0.1, cy - s * 0.15 + look[1] * s * 0.1, s * 0.12, 0, 6.283); ctx.fill();
      }
    }

    for (const p of pops) {
      ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
  }

  let last = 0, running = true;
  function frame(ts) {
    if (!running) return;
    const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
    last = ts;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  build();
  if (reduceMotion) {
    draw();
  } else {
    requestAnimationFrame(frame);
    document.addEventListener("visibilitychange", () => {
      running = !document.hidden; last = 0;
      if (running) requestAnimationFrame(frame);
    });
  }
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { build(); if (reduceMotion) draw(); }, 150);
  });
})();
</script>
</body>
</html>
