name: Deploy ComingSoon landing page

on:
  # Deploy when the landing page (or this workflow) changes on main
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  # Manual "Run workflow" button in the Actions tab
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN; deploy job adds what it needs
permissions:
  contents: read

# One deployment at a time; don't cancel a deploy that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job: the landing page is static, so "build" = package landing/
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing/ as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: landing

  # Deploy job
  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
