# Local dev stack. Variables come from local.env (gitignored), so run from the repo root:
#   docker compose -f server/compose.yaml --env-file server/local.env up -d --wait
# pgAdmin: http://localhost:5050 (first start takes ~1 min)
services:
  db:
    image: postgres:17
    container_name: bomberman-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in local.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in local.env}
      POSTGRES_DB: bomberman
      # Login roles created by deploy/postgres/init/01-roles.sh (DATABASE.md §7).
      # The init script only runs on an empty pgdata volume.
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?set PG_MIGRATOR_PASSWORD in local.env}
      PG_API_PASSWORD: ${PG_API_PASSWORD:?set PG_API_PASSWORD in local.env}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?set PG_WORKER_PASSWORD in local.env}
      PG_GAMESERVER_PASSWORD: ${PG_GAMESERVER_PASSWORD:?set PG_GAMESERVER_PASSWORD in local.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ = expanded by the container's shell, not by Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: bomberman-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in local.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in local.env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin-data:

